name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing by pushing to a branch, rather than `actions/deploy-pages`.
#
# The artifact-and-deployment path stalled for this repository: seven consecutive runs built and
# uploaded fine, then sat in `deployment_queued` until `deploy-pages` aborted at its ten-minute
# timeout, with the Pages component reported operational throughout. Each timeout also left a
# deployment `in_progress` that blocked the next run, and cancelling one marks its commit
# unpublishable for good — the deployment id is the commit sha.
#
# The Tandemonium dashboard has been publishing through a gh-pages branch on this same account
# without trouble, which is the evidence that decided this. It is the older mechanism, and it
# needs `contents: write` rather than the Pages OIDC dance, but it does not depend on the queue
# that broke.
permissions:
  contents: write

# Never let two deploys race; the newer commit always wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stampd/dashboard build
        env:
          # Repository variable. Set to the deployed Worker origin, e.g.
          # https://stampd-api.<account>.workers.dev — the API is cross-origin because
          # usersfirst.com DNS is not on Cloudflare. See issue #1.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/dashboard/dist
          publish_branch: gh-pages
          # The SPA is served from the domain apex path, so a stale file from a previous build
          # would keep being served alongside the new one.
          force_orphan: true
          # `apps/dashboard/public/CNAME` carries this too; stated here so the custom domain
          # survives even if that file is ever moved or renamed.
          cname: stampd.usersfirst.com
