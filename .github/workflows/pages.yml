name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race; the newer commit always wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stampd/dashboard build
        env:
          # Repository variable. Set to the deployed Worker origin, e.g.
          # https://stampd-api.<account>.workers.dev — the API is cross-origin because
          # usersfirst.com DNS is not on Cloudflare. See issue #1.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Repository variable. The Google OAuth client the Operator tab signs in against —
          # public by nature, since it ends up in the bundle either way. Must match the Worker's
          # GOOGLE_CLIENT_ID, or every operator token fails its audience check.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
