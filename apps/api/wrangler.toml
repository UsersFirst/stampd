name = "stampd-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Published to <name>.<account>.workers.dev. A route on stampd.usersfirst.com/api/* would
# be nicer — same origin, no CORS — but Worker routes only fire for zones Cloudflare hosts,
# and usersfirst.com DNS is at name.com. Revisit if that zone ever moves. See issue #1.
workers_dev = true

# Batch-screens images that were admitted unscreened because Vision was unreachable. Uploads
# fail open so a live event is never blocked by a third-party outage; this is what stops that
# becoming "never checked". Ten minutes bounds how long an unscreened image is served.
[triggers]
crons = ["*/10 * * * *"]

[vars]
# Browser origins permitted to call this API. The dashboard is served from GitHub Pages on
# stampd.usersfirst.com; the Vite dev server is on 5173.
ALLOWED_ORIGINS = "https://stampd.usersfirst.com"
# Consulted when an upload is signed by a smart-contract wallet (ERC-1271/6492). The chain is
# chosen per request from the signed message, not configured here: a Coinbase Smart Wallet's
# ERC-1271 hash includes the chain id, so a mainnet signature can never verify on Sepolia.
# Plain EOA signatures never reach an RPC at all.
RPC_URL_BASE_SEPOLIA = "https://sepolia.base.org"
RPC_URL_BASE = "https://mainnet.base.org"

# Content screening thresholds on Google's 5-point SafeSearch scale
# (1 VERY_UNLIKELY … 5 VERY_LIKELY). An upload is refused at or above these.
# `racy` sits a notch higher on purpose: it fires on swimwear and close-ups, and a false
# rejection is silent to the organizer. The API key itself is a secret, not a var:
#   wrangler secret put GOOGLE_VISION_API_KEY
MODERATION_THRESHOLD_ADULT = "4"
MODERATION_THRESHOLD_RACY = "5"
MODERATION_THRESHOLD_VIOLENCE = "4"

# Operator sign-in. Shared with the Tandemonium dashboard, which is why the id looks unrelated
# to stampd — one OAuth client with several authorized origins. Not a secret: a client id is
# embedded in every page that uses it. The allowlist of who may act as an operator *is* kept out
# of the repo:  wrangler secret put OPERATOR_EMAILS
GOOGLE_CLIENT_ID = "640682648249-dp1dou0mmpkm6m697oakbe9odabt1dui.apps.googleusercontent.com"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "stampd-nfts"
preview_bucket_name = "stampd-nfts-preview"

# Claim codes, claims, and event drafts. Schema in migrations/; apply with
# `pnpm --filter @stampd/api db:migrate`.
#
# database_id is written by `wrangler d1 create stampd` — it is an account-scoped
# identifier, not a secret, which is why it is committed rather than kept in a var.
[[d1_databases]]
binding = "DB"
database_name = "stampd"
database_id = "6438832e-d7d6-47c2-969c-1caa8a851214"
migrations_dir = "migrations"

[env.dev.vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
RPC_URL_BASE_SEPOLIA = "https://sepolia.base.org"
RPC_URL_BASE = "https://mainnet.base.org"

# Content screening thresholds on Google's 5-point SafeSearch scale
# (1 VERY_UNLIKELY … 5 VERY_LIKELY). An upload is refused at or above these.
# `racy` sits a notch higher on purpose: it fires on swimwear and close-ups, and a false
# rejection is silent to the organizer. The API key itself is a secret, not a var:
#   wrangler secret put GOOGLE_VISION_API_KEY
MODERATION_THRESHOLD_ADULT = "4"
MODERATION_THRESHOLD_RACY = "5"
MODERATION_THRESHOLD_VIOLENCE = "4"

# Operator sign-in. Shared with the Tandemonium dashboard, which is why the id looks unrelated
# to stampd — one OAuth client with several authorized origins. Not a secret: a client id is
# embedded in every page that uses it. The allowlist of who may act as an operator *is* kept out
# of the repo:  wrangler secret put OPERATOR_EMAILS
GOOGLE_CLIENT_ID = "640682648249-dp1dou0mmpkm6m697oakbe9odabt1dui.apps.googleusercontent.com"

[[env.dev.r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "stampd-nfts-dev"

# `wrangler dev` runs D1 against a local SQLite file and ignores database_id, but the field
# is still required for the config to parse. The id matters only for `--remote`.
[[env.dev.d1_databases]]
binding = "DB"
database_name = "stampd-dev"
database_id = "5a7d818d-28c8-43d0-a423-f8fa781835c4"
migrations_dir = "migrations"
