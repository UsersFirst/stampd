name = "stampd-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# The Worker sits in front of the GitHub Pages origin on the same hostname, so the static
# apps and the API share an origin and the claim path pays no CORS preflight.
# Requires the stampd DNS record to be proxied through Cloudflare (orange cloud).
[[routes]]
pattern = "stampd.usersfirst.com/api/*"
zone_name = "usersfirst.com"

[vars]
PUBLIC_ORIGIN = "https://stampd.usersfirst.com"
# Chain consulted when an upload is signed by a smart-contract wallet (ERC-1271/6492).
# Plain EOA signatures never reach the RPC.
VERIFY_CHAIN_ID = "84532"
RPC_URL = "https://sepolia.base.org"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "stampd-assets"
preview_bucket_name = "stampd-assets-preview"

[env.dev.vars]
PUBLIC_ORIGIN = "http://127.0.0.1:8787"
VERIFY_CHAIN_ID = "84532"
RPC_URL = "https://sepolia.base.org"

[[env.dev.r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "stampd-assets-dev"
