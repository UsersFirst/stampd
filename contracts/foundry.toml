[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000000
bytecode_hash = "none"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# One Etherscan V2 key covers every supported chain, Base included — there is no
# Base-specific key to obtain, and the `chain` field is what selects the target.
[etherscan]
base = {key = "${ETHERSCAN_API_KEY}", chain = 8453}
base_sepolia = {key = "${ETHERSCAN_API_KEY}", chain = 84532}
